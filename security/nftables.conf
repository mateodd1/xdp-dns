#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    # Rate limit meters
    set flood_v4_blacklist {
        type ipv4_addr
        flags dynamic, timeout
        timeout 5m
    }

    set flood_v6_blacklist {
        type ipv6_addr
        flags dynamic, timeout
        timeout 5m
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Loopback interface (internal daemon communications)
        iif "lo" accept

        # 2. Drop invalid connection states
        ct state invalid drop

        # 3. Accept established and related connections
        ct state { established, related } accept

        # 4. ICMP (IPv4 & IPv6 essential messages)
        ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept
        ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
        ip protocol icmp drop

        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second burst 20 packets accept
        ip6 nexthdr icmpv6 drop

        # 5. SSH (Port 62151) - Rate limited
        tcp dport 62151 ct state new limit rate 15/minute burst 25 packets accept

        # 6. HTTP & HTTPS / HTTP3 (Web UI, API & DoH)
        tcp dport { 80, 443 } accept
        udp dport 443 accept

        # 7. DNS over TLS (DoT - Port 853) - High Capacity Rate Limited
        tcp dport 853 ct state new limit rate 500/minute burst 1000 packets accept
        tcp dport 853 accept

        # 8. Standard DNS (Port 53 UDP) - High Capacity Public Resolver Rate Limited
        udp dport 53 meter dns_udp_v4 { ip saddr limit rate 1000/second burst 2000 packets } accept
        udp dport 53 meter dns_udp_v6 { ip6 saddr limit rate 1000/second burst 2000 packets } accept
        udp dport 53 drop

        # 9. Standard DNS (Port 53 TCP)
        tcp dport 53 ct state new limit rate 500/minute burst 1000 packets accept
        tcp dport 53 accept

        # 10. Default drop all other incoming traffic
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
