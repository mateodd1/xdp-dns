#!/usr/sbin/nft -f
# /etc/nftables.conf
# Strict Enterprise Firewall for xdp.es DNS Server
# Policy: Default DROP on all incoming and forwarded traffic.
# Allowed: Only SSH (62151), DNS (53 UDP/TCP), DoT (853 TCP), Web/DoH (80, 443 TCP/UDP), ICMP, and Loopback.

flush ruleset

table inet filter {
    # Sets for tracking high-frequency DNS query meters
    set dns_udp_v4 {
        type ipv4_addr
        size 65535
        flags dynamic
    }

    set dns_udp_v6 {
        type ipv6_addr
        size 65535
        flags dynamic
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Loopback interface (all internal daemon communications: blocky, unbound, caddy, local)
        iif "lo" accept

        # 2. Drop invalid connection states immediately
        ct state invalid drop

        # 3. Accept established and related connections (fast path)
        ct state { established, related } accept

        # 4. Essential ICMP (IPv4) - Rate-limited ping & error reports
        ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept
        ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
        ip protocol icmp drop

        # 5. Essential ICMPv6 (IPv6) - NDP, MTU discovery & rate-limited ping (RFC 4890 compliant)
        ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        ip6 nexthdr ipv6-icmp icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request limit rate 10/second burst 20 packets accept
        ip6 nexthdr ipv6-icmp drop

        # 6. SSH (Port 62151 TCP only) - Rate limited to prevent brute force
        tcp dport 62151 ct state new limit rate 25/minute burst 35 packets accept
        tcp dport 62151 accept

        # 7. Standard DNS (Port 53 UDP) - High Capacity Public Resolver Rate Limited (1000 qps per IP)
        udp dport 53 add @dns_udp_v4 { ip saddr limit rate 1000/second burst 2000 packets } accept
        udp dport 53 add @dns_udp_v6 { ip6 saddr limit rate 1000/second burst 2000 packets } accept
        udp dport 53 drop

        # 8. Standard DNS (Port 53 TCP) - High Capacity Rate Limited
        tcp dport 53 ct state new limit rate 500/minute burst 1000 packets accept
        tcp dport 53 accept

        # 9. DNS over TLS (DoT - Port 853 TCP) & DNS over QUIC (DoQ - Port 853 UDP)
        tcp dport 853 ct state new limit rate 500/minute burst 1000 packets accept
        tcp dport 853 accept
        udp dport 853 accept

        # 10. Web & DNS over HTTPS (DoH) & Let's Encrypt (Ports 80 & 443 TCP/UDP)
        tcp dport { 80, 443 } accept
        udp dport 443 accept

        # 11. Explicit DROP for all other incoming traffic
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
