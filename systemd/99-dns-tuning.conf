# /etc/sysctl.d/99-dns-tuning.conf
# Linux Kernel Performance Optimizations for High-Load Public DNS Resolver

# Maximum socket receive and send buffers (64MB)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432

# Increase network interface queue backlog to prevent packet loss during traffic bursts
net.core.netdev_max_backlog = 100000

# Increase maximum pending connection queue
net.core.somaxconn = 65535

# UDP Memory limits
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Expand ephemeral port range for outgoing recursive queries
net.ipv4.ip_local_port_range = 1024 65535

# TCP Optimizations for DoT and DoH
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_syn_backlog = 3240000

# File descriptor limits for high concurrency
fs.file-max = 1048576
