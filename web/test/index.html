<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="test.page_title">¿Navegas por XDP? | xdp.es DNS</title>
    <meta name="description" content="Comprueba si tu conexión resuelve las DNS a través de los servidores de xdp.es.">
    <link rel="canonical" href="https://xdp.es/test">

    <!-- Anti-FOIT Instant Theme Loader -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('xdp_theme') || 'auto';
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                const navLang = (navigator.language || (navigator.languages && navigator.languages[0]) || 'es').toLowerCase();
                document.documentElement.setAttribute('lang', navLang.startsWith('es') ? 'es' : 'en');
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    </noscript>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="/index.css?v=4.5">
    <style>
        .container {
            max-width: 980px;
            margin: 44px auto;
            padding: 0 20px;
        }

        .result-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 34px 28px;
            text-align: center;
            box-shadow: var(--shadow-card);
            max-width: 640px;
            margin: 0 auto;
        }

        .verdict { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
        .verdict.yes  { color: #10b981; }
        .verdict.no   { color: #ef4444; }
        .verdict.warn { color: #f59e0b; }

        .sub { color: var(--text-secondary); font-size: 0.92rem; margin-top: 4px; }

        .asn-list {
            list-style: none;
            padding: 0; margin: 14px 0 0;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .asn-list li { padding: 3px 0; font-variant-numeric: tabular-nums; }

        .spinner {
            display: inline-block;
            width: 22px; height: 22px;
            border: 3px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .retry {
            display: inline-block;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }
        .retry:hover { color: var(--text-primary); }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Site Header -->
        <header>
            <div class="header-top">
                <a href="/" class="back-link" aria-label="Volver al inicio" data-i18n="nav.back_home">&larr; Volver al inicio</a>
                <div class="theme-switcher" role="group" aria-label="Seleccionar tema">
                    <button type="button" class="theme-btn" data-theme-val="light" onclick="setTheme('light')" title="Modo Claro" aria-label="Modo Claro">
                        <svg class="theme-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <span class="theme-text" data-i18n="theme.light">Claro</span>
                    </button>
                    <button type="button" class="theme-btn" data-theme-val="dark" onclick="setTheme('dark')" title="Modo Oscuro" aria-label="Modo Oscuro">
                        <svg class="theme-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        <span class="theme-text" data-i18n="theme.dark">Oscuro</span>
                    </button>
                    <button type="button" class="theme-btn" data-theme-val="auto" onclick="setTheme('auto')" title="Automático" aria-label="Automático">
                        <svg class="theme-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        <span class="theme-text" data-i18n="theme.auto">Auto</span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <h1 data-i18n="test.title" style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 22px;">
                ¿Navegas por XDP?
            </h1>

            <div class="result-card">
                <div id="status" aria-live="polite">
                    <span class="spinner" role="status"></span>
                </div>
                <button type="button" class="retry" id="retry" data-i18n="test.retry" hidden>Repetir test</button>
            </div>
        </main>

        <!-- Site Footer -->
        <footer class="site-footer">
            <div>xdp.es DNS</div>
            <div class="site-footer-links">
                <a href="/about" class="site-footer-link" data-i18n="nav.about">Acerca de</a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/i18n.js?v=4.1"></script>
    <script src="/theme.js?v=4.0"></script>
    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const retryBtn = document.getElementById('retry');
            const T = (k, f) => (window.i18n && window.i18n.t(k)) || f;
            let lastResolvers = null;

            function makeToken() {
                return [...crypto.getRandomValues(new Uint8Array(4))]
                    .map(b => b.toString(16).padStart(2, '0')).join('');
            }

            function serviceName(ip) {
                if (ip === '85.208.114.51') return 'XDP AdBlock';
                if (ip === '85.208.114.52') return 'XDP Standard';
                return null;
            }

            // Logos de resolutores conocidos (assets en /test/img)
            const RESOLVER_LOGOS = [
                { file: '/test/img/google.svg', alt: 'Google Public DNS', asn: [15169], kw: ['google'] },
                { file: '/test/img/cloudflare.svg', alt: 'Cloudflare DNS', asn: [13335], kw: ['cloudflare'] },
                { file: '/test/img/quad9.svg', alt: 'Quad9', asn: [19281], kw: ['quad9', 'quad9-'] }
            ];

            // Logos de ISPs disponibles en /stats/img (mismos ASN que usa /stats)
            const ISP_LOGOS = [
                { file: '/stats/img/movistar.svg', alt: 'Movistar', asn: [3352, 6739], kw: ['telefonica', 'movistar'] },
                { file: '/stats/img/vodafone.svg', alt: 'Vodafone', asn: [12430], kw: ['vodafone'] },
                { file: '/stats/img/orange.svg', alt: 'Orange', asn: [12479], kw: ['orange'] },
                { file: '/stats/img/digi.png', alt: 'Digi', asn: [57269, 206238], kw: ['digi'] },
                { file: '/stats/img/masmovil.svg', alt: 'MásMóvil / Yoigo', asn: [15704, 210344, 15954, 56645], kw: ['yoigo', 'masmovil', 'másmóvil', 'xfera', 'pepephone', 'euskaltel'] }
            ];

            function logoFor(asn, asName) {
                const lower = String(asName || '').toLowerCase();
                // Prioridad: logos de resolutores conocidos, luego ISPs de /stats
                const resolver = RESOLVER_LOGOS.find(l =>
                    (asn != null && l.asn.includes(Number(asn))) ||
                    l.kw.some(k => lower.includes(k))
                );
                if (resolver) return resolver;
                return ISP_LOGOS.find(l =>
                    (asn != null && l.asn.includes(Number(asn))) ||
                    l.kw.some(k => lower.includes(k))
                ) || null;
            }

            function logoImg(logo) {
                return '<img src="' + logo.file + '" alt="' + logo.alt + '" style="width:20px;height:20px;vertical-align:-4px;margin-right:6px;">';
            }

            function fireBeacons(token) {
                const url = 'https://' + token + '._check.xdp.es/pixel.gif?t=' + Date.now();
                new Image().src = url;
                fetch(url, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
            }

            async function pollWatch(token) {
                for (let i = 0; i < 10; i++) {
                    await new Promise(r => setTimeout(r, 1000));
                    try {
                        const r = await fetch('/test/api/watch/' + token, { cache: 'no-store' });
                        const d = await r.json();
                        if (d.seen && d.resolvers.length) return d.resolvers;
                    } catch (e) { /* reintento */ }
                }
                return [];
            }

            function show(html, retryable) {
                statusEl.innerHTML = html;
                retryBtn.hidden = !retryable;
            }

            async function runTest() {
                retryBtn.hidden = true;
                statusEl.innerHTML = '<span class="spinner" role="status"></span> ' + T('test.checking', 'Comprobando…');

                const token = makeToken();
                fireBeacons(token);

                // Refuerzo a mitad de ventana por si algún resolver es lento
                setTimeout(() => fireBeacons(token), 2500);

                const resolvers = await pollWatch(token);
                lastResolvers = resolvers;
                renderResult(resolvers);
            }

            function renderResult(resolvers) {
                if (resolvers.length === 0) {
                    show('<div class="verdict warn">' + T('test.verdict_unknown', '⚠️ No se pudo determinar') + '</div>' +
                         '<p class="sub">' + T('test.unknown_sub', '¿Usas DoH en el navegador, Private Relay o una VPN?') + '</p>', true);
                    return;
                }

                const services = [...new Set(resolvers.map(r => serviceName(r.src_ip)).filter(Boolean))];

                if (services.length > 0) {
                    show('<div class="verdict yes">' +
                         T('test.verdict_yes', '✅ Sí — {service}').replace('{service}', services.join(' + ')) +
                         '</div>' +
                         '<p class="sub">' + T('test.verdict_yes_sub', 'Tu conexión resuelve a través de XDP.') + '</p>', true);
                } else {
                    // Agrupar por ASN+nombre: un resolver = una línea, sin repetir por IP de egreso
                    const seen = new Map();
                    for (const r of resolvers) {
                        if (!/^[0-9a-fA-F.:]+$/.test(r.src_ip)) continue;
                        const key = (r.asn != null ? r.asn : 'x') + '|' + (r.name || '');
                        if (!seen.has(key)) seen.set(key, { asn: r.asn, name: r.name });
                    }
                    const asnUnknown = T('test.asn_unknown', 'ASN desconocido');
                    const lines = [...seen.values()].map(({ asn, name }) => {
                        const logo = logoFor(asn, name);
                        const logoHtml = logo ? logoImg(logo) : '';
                        const asnTxt = asn != null ? '<strong>AS' + asn + '</strong>' : '<strong>' + asnUnknown + '</strong>';
                        const nameTxt = name ? ' · ' + name : '';
                        return '<li>' + logoHtml + asnTxt + nameTxt + '</li>';
                    }).join('');
                    show('<div class="verdict no">' + T('test.verdict_no', '❌ No usas XDP') + '</div>' +
                         '<p class="sub">' + T('test.resolver_label', 'Tu resolutor DNS:') + '</p>' +
                         '<ul class="asn-list">' + lines + '</ul>', true);
                }
            }

            window.addEventListener('langchange', () => {
                if (lastResolvers) renderResult(lastResolvers);
            });

            retryBtn.addEventListener('click', runTest);
            runTest();          // automático al cargar
        })();
    </script>
</body>
</html>
