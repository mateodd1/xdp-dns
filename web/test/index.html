    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const retryBtn = document.getElementById('retry');
            const T = (k, f) => (window.i18n && window.i18n.t(k)) || f;
            let lastResolvers = null;

            function makeToken() {
                return [...crypto.getRandomValues(new Uint8Array(4))]
                    .map(b => b.toString(16).padStart(2, '0')).join('');
            }

            function serviceName(ip) {
                if (ip === '85.208.114.51') return 'XDP AdBlock';
                if (ip === '85.208.114.52') return 'XDP Standard';
                return null;
            }

            // Logos de resolutores conocidos (assets en /test/img)
            const RESOLVER_LOGOS = [
                { file: '/test/img/google.svg', alt: 'Google Public DNS', asn: [15169], kw: ['google'] },
                { file: '/test/img/cloudflare.svg', alt: 'Cloudflare DNS', asn: [13335], kw: ['cloudflare'] },
                { file: '/test/img/quad9.svg', alt: 'Quad9', asn: [19281], kw: ['quad9', 'quad9-'] }
            ];

            // Logos de ISPs disponibles en /stats/img (mismos ASN que usa /stats)
            const ISP_LOGOS = [
                { file: '/stats/img/movistar.svg', alt: 'Movistar', asn: [3352, 6739], kw: ['telefonica', 'movistar'] },
                { file: '/stats/img/vodafone.svg', alt: 'Vodafone', asn: [12430], kw: ['vodafone'] },
                { file: '/stats/img/orange.svg', alt: 'Orange', asn: [12479], kw: ['orange'] },
                { file: '/stats/img/digi.png', alt: 'Digi', asn: [57269, 206238], kw: ['digi'] },
                { file: '/stats/img/masmovil.svg', alt: 'MásMóvil / Yoigo', asn: [15704, 210344, 15954, 56645], kw: ['yoigo', 'masmovil', 'másmóvil', 'xfera', 'pepephone', 'euskaltel'] }
            ];

            function logoFor(asn, asName) {
                const lower = String(asName || '').toLowerCase();
                // Prioridad: logos de resolutores conocidos, luego ISPs de /stats
                const resolver = RESOLVER_LOGOS.find(l =>
                    (asn != null && l.asn.includes(Number(asn))) ||
                    l.kw.some(k => lower.includes(k))
                );
                if (resolver) return resolver;
                return ISP_LOGOS.find(l =>
                    (asn != null && l.asn.includes(Number(asn))) ||
                    l.kw.some(k => lower.includes(k))
                ) || null;
            }

            function logoImg(logo) {
                return '<img src="' + logo.file + '" alt="' + logo.alt + '" style="width:20px;height:20px;vertical-align:-4px;margin-right:6px;">';
            }

            function triggerDnsResolution(token) {
                const domain = token + '._check.xdp.es';
                const ts = Date.now();

                // 1. Browser Native DNS Prefetch & Preconnect (executes at OS network level, immune to adblockers)
                const prefetch = document.createElement('link');
                prefetch.rel = 'dns-prefetch';
                prefetch.href = '//' + domain;
                document.head.appendChild(prefetch);

                const preconnect = document.createElement('link');
                preconnect.rel = 'preconnect';
                preconnect.href = 'https://' + domain;
                preconnect.crossOrigin = 'anonymous';
                document.head.appendChild(preconnect);

                // 2. WebRTC STUN Host Lookup (forces browser ICE subsystem to resolve domain natively)
                try {
                    const RTCPC = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
                    if (RTCPC) {
                        const pc = new RTCPC({ iceServers: [{ urls: 'stun:' + domain + ':3478' }] });
                        pc.createDataChannel('');
                        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                        setTimeout(() => { try { pc.close(); } catch (e) {} }, 4000);
                    }
                } catch (e) {}

                // 3. Subresource stylesheet link (triggers DNS resolution for asset)
                const css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = 'https://' + domain + '/probe.css?t=' + ts;
                document.head.appendChild(css);

                // 4. Benign Image probe (uses .png / .ico, avoiding pixel.gif adblock patterns)
                try {
                    const img = new Image();
                    img.src = 'https://' + domain + '/probe.png?t=' + ts;
                } catch (e) {}

                // 5. Benign Fetch requests (HTTPS & HTTP)
                try {
                    fetch('https://' + domain + '/probe.json?t=' + ts, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
                } catch (e) {}
                try {
                    fetch('http://' + domain + '/probe.json?t=' + ts, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
                } catch (e) {}

                // Clean up injected DOM nodes after 6 seconds
                setTimeout(() => {
                    try { prefetch.remove(); } catch (e) {}
                    try { preconnect.remove(); } catch (e) {}
                    try { css.remove(); } catch (e) {}
                }, 6000);
            }

            async function pollWatch(token) {
                for (let i = 0; i < 10; i++) {
                    await new Promise(r => setTimeout(r, 1000));
                    try {
                        const r = await fetch('/test/api/watch/' + token, { cache: 'no-store' });
                        const d = await r.json();
                        if (d.seen && d.resolvers.length) return d.resolvers;
                    } catch (e) { /* reintento */ }
                }
                return [];
            }

            function show(html, retryable) {
                statusEl.innerHTML = html;
                retryBtn.hidden = !retryable;
            }

            async function runTest() {
                retryBtn.hidden = true;
                statusEl.innerHTML = '<span class="spinner" role="status"></span> ' + T('test.checking', 'Comprobando…');

                const token = makeToken();
                triggerDnsResolution(token);

                // Refuerzo a 1.5s por si el primer intento tardó en resolver
                setTimeout(() => triggerDnsResolution(token), 1500);

                const resolvers = await pollWatch(token);
                lastResolvers = resolvers;
                renderResult(resolvers);
            }

            function renderResult(resolvers) {
                if (resolvers.length === 0) {
                    show('<div class="verdict warn">' + T('test.verdict_unknown', '⚠️ No se pudo determinar') + '</div>' +
                         '<p class="sub">' + T('test.unknown_sub', '¿Usas DoH en el navegador, Private Relay o una VPN?') + '</p>', true);
                    return;
                }

                const services = [...new Set(resolvers.map(r => serviceName(r.src_ip)).filter(Boolean))];

                if (services.length > 0) {
                    show('<div class="verdict yes">' +
                         T('test.verdict_yes', '✅ Sí — {service}').replace('{service}', services.join(' + ')) +
                         '</div>' +
                         '<p class="sub">' + T('test.verdict_yes_sub', 'Tu conexión resuelve a través de XDP.') + '</p>', true);
                } else {
                    // Agrupar por ASN+nombre: un resolver = una línea, sin repetir por IP de egreso
                    const seen = new Map();
                    for (const r of resolvers) {
                        if (!/^[0-9a-fA-F.:]+$/.test(r.src_ip)) continue;
                        const key = (r.asn != null ? r.asn : 'x') + '|' + (r.name || '');
                        if (!seen.has(key)) seen.set(key, { asn: r.asn, name: r.name });
                    }
                    const asnUnknown = T('test.asn_unknown', 'ASN desconocido');
                    const lines = [...seen.values()].map(({ asn, name }) => {
                        const logo = logoFor(asn, name);
                        const logoHtml = logo ? logoImg(logo) : '';
                        const asnTxt = asn != null ? '<strong>AS' + asn + '</strong>' : '<strong>' + asnUnknown + '</strong>';
                        const nameTxt = name ? ' · ' + name : '';
                        return '<li>' + logoHtml + asnTxt + nameTxt + '</li>';
                    }).join('');
                    show('<div class="verdict no">' + T('test.verdict_no', '❌ No usas XDP') + '</div>' +
                         '<p class="sub">' + T('test.resolver_label', 'Tu resolutor DNS:') + '</p>' +
                         '<ul class="asn-list">' + lines + '</ul>', true);
                }
            }

            window.addEventListener('langchange', () => {
                if (lastResolvers) renderResult(lastResolvers);
            });

            retryBtn.addEventListener('click', runTest);
            runTest();          // automático al cargar
        })();
    </script>
