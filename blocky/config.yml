blocking:
  allowlists:
    ads:
    - s.click.aliexpress.com
  blockTTL: 1m
  blockType: zeroIp
  clientGroupsBlock:
    default:
    - ads
  denylists:
    ads:
    - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi.txt
  loading:
    downloads:
      attempts: 3
      cooldown: 10s
      timeout: 60s
    refreshPeriod: 24h
bootstrapDns:
- 127.0.0.1:5335
- 1.1.1.1
caching:
  maxItemsCount: 0
  maxTime: -1m
  minTime: -1m
certFile: /etc/xdp-tls/fullchain.pem
customDNS:
  customTTL: 1h
  # A/AAAA locales, pero HTTPS (ECH), TXT, etc. siguen a Unbound (si no, el HTTPS RR con ech= sale vacío)
  filterUnmappedTypes: false
  mapping:
    dns.xdp.es: 85.208.114.51,2a0e:97c0:c40::51
    lite.xdp.es: 85.208.114.52,2a0e:97c0:c40::52
ecs:
  forward: false
  useAsClient: true
keyFile: /etc/xdp-tls/privkey.pem
log:
  format: text
  level: warn
  timestamp: true
ports:
  dns:
  - 85.208.114.51:53
  - 127.0.0.1:53
  - '[2a0e:97c0:c40::51]:53'
  - '[::1]:53'
  http: 127.0.0.1:4000
  tls:
  - 85.208.114.51:853
  - 127.0.0.1:853
  - '[2a0e:97c0:c40::51]:853'
  - '[::1]:853'
prometheus:
  enable: true
  path: /metrics
queryLog:
  type: none
upstreams:
  groups:
    default:
    - tcp+udp:127.0.0.1:5335
  strategy: strict
  timeout: 4s
