# /etc/unbound/unbound-lite.conf
# High-Performance Pure Recursive DNS Resolver for Lite / Standard Service (.52)
# Egress visible to internet: 85.208.114.52 / 2a0e:97c0:c40::52 (lite.xdp.es)

server:
    # Basic Server & Zero-Logs Settings
    verbosity: 0
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-servfail: no
    log-local-actions: no
    logfile: ""
    use-syslog: no
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: yes

    # Interface & Ports
    interface: 127.0.0.1@5338
    interface: ::1@5338
    port: 5338
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Explicit Outgoing IP Bindings (.52 Egress)
    outgoing-interface: 85.208.114.52
    outgoing-interface: 2a0e:97c0:c40::52

    # Access Control (Internal upstream only)
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Concurrency & Performance Tuning
    num-threads: 4
    so-reuseport: yes
    so-rcvbuf: 8m
    so-sndbuf: 8m

    # Memory & Cache Sizing
    msg-cache-size: 128m
    rrset-cache-size: 256m
    key-cache-size: 32m
    neg-cache-size: 32m

    # Cache Slabs
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Fast Server Selection & Target Fetch Optimization
    fast-server-permil: 900
    fast-server-num: 3
    target-fetch-policy: "2 1 0 0 0"

    # Cache Optimization & Prefetching
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 300
    infra-cache-numhosts: 100000
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-client-timeout: 1800

    # Privacy & Hardening
    use-caps-for-id: no
    qname-minimisation: yes
    qname-minimisation-strict: no
    hide-identity: yes
    hide-version: yes
    identity: "xdp-dns-lite"
    version: "1.0.0"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    deny-any: yes
    val-clean-additional: yes
    val-permissive-mode: no
    unwanted-reply-threshold: 10000000

    # Buffer & Port Allocation
    outgoing-range: 4096
    num-queries-per-thread: 2048
    infra-cache-min-rtt: 50

    # Rate Limiting
    ratelimit: 0
    ip-ratelimit: 0

    # DNSSEC Trust Anchor & Root Hints
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8954
    control-use-cert: no
