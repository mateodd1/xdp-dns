# /etc/unbound/unbound.conf
# High-Performance 100% Pure Recursive DNS Resolver Configuration
# Resolves directly from Root Servers (a.root-servers.net .. m.root-servers.net) -> TLD -> Authoritative
# Source IP visible to internet: 85.208.114.51 / 2a0e:97c0:c40::51 (xdp.es)

server:
    # Basic Server Settings
    verbosity: 1
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: yes

    # Interface & Ports
    # Standard DNS on Port 53 (UDP & TCP)
    interface: 0.0.0.0@53
    interface: ::0@53
    # Dedicated internal port for Blocky DoH/DoT upstream
    interface: 127.0.0.1@5335
    interface: ::1@5335
    
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Explicit Outgoing IP Bindings
    outgoing-interface: 85.208.114.51
    outgoing-interface: 2a0e:97c0:c40::51

    # Access Control (Public resolver)
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Concurrency & Performance Tuning (8 Dedicated Cores / Multi-Threaded)
    num-threads: 8
    so-reuseport: yes
    so-rcvbuf: 16m
    so-sndbuf: 16m

    # Memory & Cache Sizing
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 64m
    neg-cache-size: 64m

    # Cache Slabs (Power of 2 matching 8 threads to prevent lock contention)
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Fast Server Selection & Target Fetch Optimization
    fast-server-permil: 900
    fast-server-num: 3
    target-fetch-policy: "2 1 0 0 0"

    # Cache Optimization & Prefetching
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 300
    infra-cache-numhosts: 150000
    infra-host-ttl: 900
    prefetch: yes
    prefetch-key: yes

    # Serve Expired Records (Instant 0ms responses from cache while refreshing in background)
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-client-timeout: 0
    serve-expired-reply-ttl: 30

    # Query Buffer Limits
    outgoing-range: 8192
    num-queries-per-thread: 4096
    outgoing-num-tcp: 1024
    incoming-num-tcp: 1024
    edns-buffer-size: 1232
    max-udp-size: 1232

    # Module Pipeline (Python dynamic blackhole IP evasion -> DNSSEC Validator -> Iterator)
    module-config: "python validator iterator"

    # DNS Privacy & RFC Compliance
    qname-minimisation: yes
    qname-minimisation-strict: no

    # Security & Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    harden-referral-path: yes
    use-caps-for-id: yes
    val-clean-additional: yes
    deny-any: yes
    unwanted-reply-threshold: 10000000

    # Privacy & Identity Obfuscation
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
    identity: "xdp.es DNS"
    version: "1.0"
    minimal-responses: yes
    rrset-roundrobin: yes

    # Anti-Amplification & Anti-DDoS Rate Limiting (RRL) - High Capacity Public Resolver
    ratelimit: 10000
    ip-ratelimit: 2000
    ratelimit-factor: 10
    ip-ratelimit-factor: 10
    ratelimit-slabs: 8
    ip-ratelimit-slabs: 8

    # DNSSEC Trust Anchor & Root Hints
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no

python:
    python-script: "/etc/unbound/evade_blackhole.py"
