# /etc/unbound/unbound.conf
# High-Performance 100% Pure Recursive DNS Resolver Configuration
# Resolves directly from Root Servers (a.root-servers.net .. m.root-servers.net) -> TLD -> Authoritative
# Source IP visible to internet: 85.208.114.51 / 2a0e:97c0:c40::51 (xdp.es)

server:
    # Archive IPv4 overrides. Transparent zones affect only these exact names.
    # Missing types (AAAA and HTTPS/SVCB included) return NOERROR/NODATA.
    local-zone: "archive.is." transparent
    local-data: "archive.is. 60 IN A 185.195.236.97"
    local-zone: "archive.li." transparent
    local-data: "archive.li. 60 IN A 185.195.236.97"
    local-zone: "archive.ph." transparent
    local-data: "archive.ph. 60 IN A 185.195.236.97"
    local-zone: "archive.today." transparent
    local-data: "archive.today. 60 IN A 185.195.236.97"

    # Basic Server & Zero-Logs Settings
    verbosity: 0
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-servfail: no
    log-local-actions: no
    logfile: ""
    use-syslog: no
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: yes

    # Interface & Ports
    # Internal recursive resolver interface for DNS Evasion Proxy & Blocky
    interface: 127.0.0.1@5336
    interface: ::1@5336
    port: 5336
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    # IPv6 hacia los autoritativos sale por rutas peores desde este host (.es: 0-2 ms v4 vs 32-46 ms v6)
    prefer-ip4: yes

    # Explicit Outgoing IP Bindings
    outgoing-interface: 85.208.114.51
    outgoing-interface: 2a0e:97c0:c40::51

    # Access Control (Public resolver)
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Concurrency & Performance Tuning (8 Dedicated Cores / Multi-Threaded)
    num-threads: 8
    so-reuseport: yes
    so-rcvbuf: 16m
    so-sndbuf: 16m

    # Memory & Cache Sizing
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 64m
    neg-cache-size: 64m

    # Cache Slabs (Power of 2 matching 8 threads to prevent lock contention)
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Fast Server Selection & Target Fetch Optimization
    fast-server-permil: 900
    # 1 = el 90 % de las consultas van al servidor con menor RTT medido (con 3, .es caía
    # la mitad de las veces en h.nic.es a 68 ms teniendo c.nic.es a 0 ms); 10 % exploración
    fast-server-num: 1
    target-fetch-policy: "2 1 0 0 0"

    # Cache Optimization & Prefetching
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 300
    infra-cache-numhosts: 150000
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-client-timeout: 100

    # Privacy & Hardening (Zero logs / Minimal information leakage)
    use-caps-for-id: no
    qname-minimisation: yes
    qname-minimisation-strict: no
    hide-identity: yes
    hide-version: yes
    identity: "xdp-dns"
    version: "1.0.0"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    deny-any: yes
    val-clean-additional: yes
    val-permissive-mode: no
    unwanted-reply-threshold: 10000000

    # Buffer & Port Allocation
    outgoing-range: 8192
    num-queries-per-thread: 4096
    infra-cache-min-rtt: 50

    # Public-scale Rate Limiting & DoS Defense
    ratelimit: 0
    ip-ratelimit: 0
    ratelimit-factor: 10
    ip-ratelimit-factor: 10
    ratelimit-slabs: 8
    ip-ratelimit-slabs: 8

    # DNSSEC Trust Anchor & Root Hints
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

# Copia local de la zona raíz (RFC 8806 "hyperlocal root"): se transfiere por AXFR
# desde los servidores raíz y se usa solo hacia arriba (for-upstream). Las consultas
# a la raíz cuestan 0 ms, los TLD inexistentes se responden al instante y no sale
# ninguna consulta hacia los raíz. Si la transferencia falla, fallback-enabled
# vuelve a la recursión normal.
auth-zone:
    name: "."
    primary: 192.33.4.12           # c.root-servers.net (Madrid, 0 ms)
    primary: 192.5.5.241           # f.root-servers.net (1 ms)
    primary: 193.0.14.129          # k.root-servers.net
    primary: 170.247.170.2         # b.root-servers.net
    primary: 199.7.91.13           # d.root-servers.net
    primary: 192.112.36.4          # g.root-servers.net
    primary: 192.0.47.132          # xfr.cjr.dns.icann.org
    primary: 192.0.32.132          # xfr.lax.dns.icann.org
    primary: 2001:500:2::c         # c
    primary: 2001:500:2f::f        # f
    primary: 2001:7fd::1           # k
    primary: 2801:1b8:10::b        # b
    primary: 2001:500:2d::d        # d
    primary: 2001:500:12::d0d      # g
    primary: 2620:0:2830:202::132  # xfr.cjr
    primary: 2620:0:2d0:202::132   # xfr.lax
    fallback-enabled: yes
    for-downstream: no
    for-upstream: yes
    zonefile: "/var/lib/unbound/root.zone"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no
