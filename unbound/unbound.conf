# /etc/unbound/unbound.conf
# High-Performance 100% Pure Recursive DNS Resolver Configuration
# Resolves directly from Root Servers (a.root-servers.net .. m.root-servers.net) -> TLD -> Authoritative
# Source IP visible to internet: 85.208.114.51 / 2a0e:97c0:c40::51 (xdp.es)

server:
    # Basic Server & Zero-Logs Settings
    verbosity: 0
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-servfail: no
    log-local-actions: no
    logfile: ""
    use-syslog: no
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: yes

    # Interface & Ports
    # Internal recursive resolver interface for DNS Evasion Proxy & Blocky
    interface: 127.0.0.1@5336
    interface: ::1@5336
    port: 5336
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Explicit Outgoing IP Bindings
    outgoing-interface: 85.208.114.51
    outgoing-interface: 2a0e:97c0:c40::51

    # Access Control (Public resolver)
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Concurrency & Performance Tuning (8 Dedicated Cores / Multi-Threaded)
    num-threads: 8
    so-reuseport: yes
    so-rcvbuf: 16m
    so-sndbuf: 16m

    # Memory & Cache Sizing
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 64m
    neg-cache-size: 64m

    # Cache Slabs (Power of 2 matching 8 threads to prevent lock contention)
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Fast Server Selection & Target Fetch Optimization
    fast-server-permil: 900
    fast-server-num: 3
    target-fetch-policy: "2 1 0 0 0"

    # Cache Optimization & Prefetching
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 300
    infra-cache-numhosts: 150000
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-client-timeout: 100

    # Privacy & Hardening (Zero logs / Minimal information leakage)
    use-caps-for-id: no
    qname-minimisation: yes
    qname-minimisation-strict: no
    hide-identity: yes
    hide-version: yes
    identity: "xdp-dns"
    version: "1.0.0"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    deny-any: yes
    val-clean-additional: yes
    val-permissive-mode: no
    unwanted-reply-threshold: 10000000

    # Buffer & Port Allocation
    outgoing-range: 8192
    num-queries-per-thread: 4096
    infra-cache-min-rtt: 50

    # Public-scale Rate Limiting & DoS Defense
    ratelimit: 0
    ip-ratelimit: 0
    ratelimit-factor: 10
    ip-ratelimit-factor: 10
    ratelimit-slabs: 8
    ip-ratelimit-slabs: 8

    # DNSSEC Trust Anchor & Root Hints
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no
